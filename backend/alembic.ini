# alembic.ini — Alembic configuration for Student-Document-OCR
# Run from backend/ directory: alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .

# Sẽ được override trong env.py bằng ALEMBIC_DATABASE_URL từ .env
sqlalchemy.url = postgresql+psycopg2://ocr_user:CHANGE_ME@localhost:5432/ocr_db

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
